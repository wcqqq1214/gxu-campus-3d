th d="M 124 225 L 166 207 M 303 275 L 380 249" fill="none" stroke="#587568"/><circle cx="303" cy="275" r="3" fill="#23749b"/><text x="383" y="251" font-size="12" fill="#253d49">D · 已有人员入口</text><text x="341" y="396" font-size="12" fill="#253d49">低翼</text><text x="317" y="426" font-size="12" fill="#23749b">H-N · 已校准上部窗带</text><text x="322" y="470" font-size="19" fill="#253d49">实验大厅</text><text x="288" y="545" font-size="14" fill="#a86f32">H-S / C · 门位待定位</text><text x="548" y="475" font-size="12" fill="#a86f32">H-E</text><text x="165" y="475" font-size="12" fill="#a86f32">H-W</text><path d="M 568 180 V 123 L 562 136 M 568 123 L 574 136" fill="none" stroke="#253d49" stroke-width="2"/><text x="562" y="112" font-size="16" fill="#253d49">N</text><path d="M 630 98 V 572" stroke="#d4dcd9"/><text x="667" y="117" font-size="20" fill="#253d49">本轮新增线索</text><text x="667" y="150" font-size="14" fill="#253d49">6:23设备铭牌可关联大型结构平台。</text><text x="667" y="178" font-size="14" fill="#253d49">室内开口尚不能对应地理墙面。</text><text x="667" y="206" font-size="14" fill="#253d49">转场叠影不用于门数或尺寸测量。</text><text x="667" y="266" font-size="20" fill="#253d49">落模前需要</text><text x="667" y="300" font-size="14" fill="#253d49">明确外墙转角和可识别邻楼；</text><text x="667" y="328" font-size="14" fill="#253d49">确认开口通向室外；</text><text x="667" y="356" font-size="14" fill="#253d49">确定沿墙位置及有依据的估算范围。</text><text x="667" y="419" font-size="20" fill="#253d49">下一独立工作包</text><text x="667" y="453" font-size="14" fill="#253d49">北楼南/西面与西门厅屋面。</text><text x="667" y="481" font-size="14" fill="#253d49">南墙候选继续待外景配准。</text><text x="30" y="610" font-size="14" fill="#253d49">蓝线：北墙上部已有影像约束；棕线：未核实墙面，白墙占位不等于真实无开口。</text><text x="30" y="636" font-size="12" fill="#253d49">2026-09-30 · way/957404988 · 原占地与六分部保持 · 室内画面没有赋予任何门洞朝向</text></g></svg>
