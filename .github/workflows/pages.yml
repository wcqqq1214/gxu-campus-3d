name: 发布广西大学三维校园
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-dev.txt
            scripts/constraints-geodata.txt
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-dev.txt -c scripts/constraints-geodata.txt
      - name: Python 静态检查
        run: npm run lint:python -- --output-format=github
      - name: 安装无损 JPEG 测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libjpeg-turbo-progs
          command -v jpegtran
      - name: 安装 Blender 几何测试运行时
        run: |
          set -euo pipefail
          geometry_blender_archive="$RUNNER_TEMP/blender-5.2.2-linux-x64.tar.xz"
          curl --fail --location --retry 3 \
            https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz \
            --output "$geometry_blender_archive"
          # 固定校验值来自同版本的官方 blender-5.2.2.sha256。
          echo "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168  $geometry_blender_archive" | sha256sum --check
          tar -xf "$geometry_blender_archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/blender-5.2.2-linux-x64/blender" --version
          echo "$RUNNER_TEMP/blender-5.2.2-linux-x64" >> "$GITHUB_PATH"
      - run: npm run check
      - run: npm run test:data
      - run: npm run test:geometry
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && '/gxu-campus-3d' || steps.pages.outputs.base_path }}
      - name: 安装浏览器回归运行时
        run: npx --no-install playwright install --with-deps --no-shell chromium
      - name: 菜单、相机与中英文浏览器回归
        timeout-minutes: 25
        run: npm run test:browser -- --skip-build
        env:
          SWIFTSHADER: '1'
          PAGES_BASE_PATH: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && '/gxu-campus-3d' || steps.pages.outputs.base_path }}
      - name: 保存浏览器失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/browser-checks/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: out
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
